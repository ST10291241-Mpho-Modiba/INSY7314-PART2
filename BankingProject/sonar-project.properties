# SonarCloud Configuration for Banking Application
sonar.projectKey=banking-secure-app
sonar.organization=your-org
sonar.projectName=Secure Banking Application
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=frontend/src,Backend
sonar.tests=frontend/src,Backend
sonar.test.inclusions=**/*.test.js,**/*.spec.js
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.min.js

# Frontend specific settings
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,Backend/coverage/lcov.info

# Language settings
sonar.sourceEncoding=UTF-8

# Security hotspot rules
sonar.security.hotspots.inherit=NONE

# Quality gate settings
sonar.qualitygate.wait=true

# Coverage settings
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**,**/tests/**

# Duplication settings
sonar.cpd.exclusions=**/*.test.js,**/*.spec.js

# Security-specific rules for banking applications
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Ignore console.log in development files
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2228
sonar.issue.ignore.multicriteria.e1.resourceKey=**/dev/**

# Banking-specific security rules
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S4502
sonar.issue.ignore.multicriteria.e2.resourceKey=**

# Cryptography rules
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S4426
sonar.issue.ignore.multicriteria.e3.resourceKey=**

# Authentication rules
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S5122
sonar.issue.ignore.multicriteria.e4.resourceKey=**

# Input validation rules
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S5131
sonar.issue.ignore.multicriteria.e5.resourceKey=**